version: '3.8'

services:
  traefik:
    image: traefik:latest
    container_name: cardapio_traefik
    restart: always
    command:
      - "--log.level=DEBUG"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@topautomacaojr.top"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "./traefik_dynamic:/dynamic"
    networks:
      - crm_default

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardapio_online_api
    restart: always
    env_file:
      - .env
    # O utilizador do contentor não tem privilégios (uid 100). O bind-mount de
    # traefik_dynamic vem do host, pelo que tem de lhe pertencer, ou a aplicação não
    # consegue gravar as rotas de novos restaurantes:
    #   chown -R 100:101 traefik_dynamic
    user: "100:101"
    volumes:
      # Os montes anteriores para /root/.env e /root/static foram removidos: o WORKDIR
      # passou a /app, e os ficheiros estáticos são copiados para a imagem no build.
      # As variáveis de ambiente já entram por env_file.
      - ./traefik_dynamic:/traefik_dynamic
      # Uploads têm de sobreviver a um rebuild da imagem.
      - ./uploads:/app/static/uploads
    networks:
      - crm_default

networks:
  crm_default:
    external: true
