<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Definir nova senha</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
    <div class="glass" style="width:100%; max-width:420px; padding:2rem; border-radius:var(--radius-md);">
      <h1 style="font-size:1.35rem; margin-bottom:0.5rem;">Definir nova senha</h1>
      <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.5rem;">
        Escolha uma senha com pelo menos 8 caracteres, incluindo letras e números.
      </p>

      <form id="reset-form">
        <div class="form-group">
          <label for="nova-senha">Nova senha</label>
          <input type="password" id="nova-senha" class="form-control" required
                 autocomplete="new-password" minlength="8">
        </div>

        <div class="form-group" style="margin-top:1rem;">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <input type="password" id="confirmar-senha" class="form-control" required
                 autocomplete="new-password" minlength="8">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-guardar"
                style="width:100%; margin-top:1.5rem;">Guardar nova senha</button>
      </form>

      <div id="sem-token" style="display:none;">
        <p style="color:var(--danger); font-size:0.9rem;">
          Este link não é válido. Peça um novo email de recuperação a partir do ecrã de entrada.
        </p>
        <a href="/admin" class="btn btn-secondary" style="width:100%; margin-top:1rem;">Ir para o painel</a>
      </div>

      <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem;">
        <a href="/admin" style="color:var(--text-muted);">Voltar ao painel</a>
      </p>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/reset.js"></script>
</body>
</html>
